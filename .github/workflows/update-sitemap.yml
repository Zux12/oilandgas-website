name: Update publication sitemap

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-sitemap.yml', 'tools/build_public_people.py', 'tools/public-people.json', 'm-zurix-mohamed.html']
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: publication-sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the Pages publishing source
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type,.source.branch,.source.path] | join(" ")')
          if [[ "$source" != "legacy main /" ]]; then
            echo "::error::This workflow is for GitHub Pages published from the main branch, root folder. Current source is $source."
            exit 1
          fi

      - name: Build public profiles and sitemap
        run: python3 tools/build_public_people.py

      - name: Save changes and refresh GitHub Pages
        run: |
          git add -- authors/ sitemap.xml m-zurix-mohamed.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update public profiles and sitemap"
            git push origin HEAD:main
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          elif ! curl --fail --silent --show-error --location --max-time 30 https://oilandgas.eu.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || ! cmp -s sitemap.xml "$RUNNER_TEMP/live-sitemap.xml"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
